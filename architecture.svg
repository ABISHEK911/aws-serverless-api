<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4B5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#1F2937">Serverless Notes API — Architecture</text>
  <text x="450" y="66" text-anchor="middle" font-size="13" fill="#6B7280">API Gateway → Lambda → DynamoDB, secured with a least-privilege IAM role</text>

  <!-- Client -->
  <rect x="370" y="95" width="160" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="450" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Client</text>
  <text x="450" y="136" text-anchor="middle" font-size="11" fill="#6B7280">curl / Postman / app</text>

  <line x1="450" y1="151" x2="450" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="300" y="190" width="300" height="112" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="450" y="214" text-anchor="middle" font-size="14" font-weight="700" fill="#92400E">API Gateway (HTTP API)</text>
  <text x="320" y="236" font-size="11.5" fill="#78350F">GET    /notes</text>
  <text x="320" y="253" font-size="11.5" fill="#78350F">GET    /notes/{id}</text>
  <text x="320" y="270" font-size="11.5" fill="#78350F">POST   /notes</text>
  <text x="320" y="287" font-size="11.5" fill="#78350F">DELETE /notes/{id}</text>

  <line x1="450" y1="302" x2="450" y2="339" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="325" font-size="10.5" fill="#6B7280">AWS_PROXY integration</text>

  <!-- Lambda -->
  <rect x="330" y="341" width="240" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="450" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#991B1B">Lambda (Python 3.12)</text>
  <text x="450" y="387" text-anchor="middle" font-size="11.5" fill="#7F1D1D">serverless-api-notes-handler</text>
  <text x="450" y="403" text-anchor="middle" font-size="10.5" fill="#7F1D1D">get / list / create / delete</text>

  <line x1="450" y1="417" x2="450" y2="454" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="440" font-size="10.5" fill="#6B7280">scoped IAM role</text>

  <!-- DynamoDB -->
  <rect x="330" y="456" width="240" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="450" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">DynamoDB</text>
  <text x="450" y="498" text-anchor="middle" font-size="11.5" fill="#1E3A8A">serverless-api-notes table</text>

  <!-- IAM role box, off to the side -->
  <rect x="650" y="341" width="210" height="171" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="755" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">IAM: Lambda Exec Role</text>
  <text x="668" y="390" font-size="10.5" fill="#4C1D95">✓ GetItem / PutItem</text>
  <text x="668" y="406" font-size="10.5" fill="#4C1D95">✓ UpdateItem / DeleteItem</text>
  <text x="668" y="422" font-size="10.5" fill="#4C1D95">✓ Scan / Query</text>
  <text x="668" y="438" font-size="10.5" fill="#4C1D95">— scoped to this table's</text>
  <text x="668" y="452" font-size="10.5" fill="#4C1D95">  ARN only, not "*"</text>
  <text x="668" y="474" font-size="10.5" fill="#991B1B" font-weight="600">✗ No AdministratorAccess</text>
  <text x="668" y="490" font-size="10.5" fill="#991B1B" font-weight="600">✗ No access to other tables</text>

  <line x1="650" y1="405" x2="570" y2="379" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="3,3"/>
</svg>
